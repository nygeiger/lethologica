name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/codebase/lethologica/backend
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm build
            source ~/scripts/fetch-ssm-params.sh
            pm2 restart lethologica --update-env || pm2 start dist/index.js --name lethologica
            pm2 save
