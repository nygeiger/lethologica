name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lethologica_user
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: lethologica_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Run tests
        run: pnpm test
        working-directory: backend
        env:
          DATABASE_URL: ephemeralName
          TEST_DATABASE_URL: postgresql://lethologica_user:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/lethologica_test_db
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          NODE_ENV: test
          PORT: 3001

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/home/ubuntu/.nvm/versions/node/v24.18.0/bin
            cd ~/codebase/lethologica/backend
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm build
            source ./scripts/fetch-ssm-params.sh
            pm2 restart lethologica --update-env || pm2 start dist/src/server.js --name lethologica
            pm2 save
