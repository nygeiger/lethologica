name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/home/ubuntu/.nvm/versions/node/v24.18.0/bin
            cd ~/codebase/lethologica/backend
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm build
            source ./scripts/fetch-ssm-params.sh
            pm2 restart lethologica --update-env || pm2 start dist/index.js --name lethologica
            pm2 save
